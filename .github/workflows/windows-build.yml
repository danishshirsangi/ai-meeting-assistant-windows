name: Build Windows Installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version (major.minor.patch)
        default: '1.0.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be major.minor.patch' }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-audio-windows.txt
          python -m pip install pytest pyinstaller
          python -m pip check
      - name: Test
        run: python -m pytest -q
      - name: Package application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name AI-Meeting-Assistant --add-data "assets;assets" --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all soundcard --collect-all sounddevice --collect-all soundfile --collect-all _sounddevice_data --collect-all _soundfile_data --collect-all pynput --collect-all google.genai --collect-all pygments main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Create installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:APP_VERSION" installer/setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          Get-FileHash release/*.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Meeting-Assistant-${{ inputs.version }}-x64-Setup
          path: release/*.exe
          if-no-files-found: error
