name: Build Windows Portable
on:
  push:
    branches: [Dev-Setup]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'packaging/**'
      - 'main.py'
      - 'core/**'
      - 'audio/**'
      - 'ui/**'
      - 'tests/**'
      - 'assets/**'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      version:
        description: Portable version (major.minor.patch)
        default: '1.0.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be major.minor.patch' }
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          (Get-Content requirements.txt) -replace '^PySide6>=', 'PySide6-Essentials>=' | Set-Content "$env:RUNNER_TEMP/requirements-portable.txt"
          python -m pip install -r "$env:RUNNER_TEMP/requirements-portable.txt" -r requirements-audio-windows.txt
          python -m pip install pytest pyinstaller
          python -m pip check
      - name: Source, dependency and secret security checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force security-reports | Out-Null
          python -m pip freeze | Set-Content security-reports/dependencies.txt
          python -m venv "$env:RUNNER_TEMP/security-tools"
          $scanner = "$env:RUNNER_TEMP/security-tools/Scripts/python.exe"
          & $scanner -m pip install bandit pip-audit
          if ($LASTEXITCODE -ne 0) { throw 'Security tools installation failed' }
          $failed = $false
          & $scanner -m bandit -r core audio ui main.py -f json -o security-reports/bandit.json -lll
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          & $scanner -m pip_audit -r security-reports/dependencies.txt --no-deps --disable-pip --format json --output security-reports/pip-audit.json
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          choco install gitleaks -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Gitleaks installation failed' }
          gitleaks git . --redact=100 --report-format json --report-path security-reports/gitleaks.json
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { throw 'Security audit failed; review security reports before distribution' }
      - name: Test
        run: python -m pytest -q
      - name: Package application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name AI-Meeting-Assistant --add-data "assets;assets" --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all soundcard --collect-all sounddevice --collect-all soundfile --collect-all _sounddevice_data --collect-all _soundfile_data --collect-all pynput --copy-metadata google-genai --exclude-module google.genai.tests --exclude-module pytest --exclude-module _pytest --exclude-module tkinter --hidden-import PySide6.QtSvg --collect-all pygments main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Smoke test frozen application
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path 'dist/AI-Meeting-Assistant/AI-Meeting-Assistant.exe') -ArgumentList '--packaging-smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Frozen application smoke test failed: $($p.ExitCode)" }
      - name: Report bundled file sizes
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/AI-Meeting-Assistant -File -Recurse
          "Uncompressed size (MiB): {0:N2}" -f (($files | Measure-Object Length -Sum).Sum / 1MB)
          $files | Sort-Object Length -Descending | Select-Object -First 30 @{Name='MiB';Expression={[math]::Round($_.Length / 1MB,2)}}, FullName | Format-Table -AutoSize | Out-String -Width 300
      - name: Prepare portable folder
        shell: pwsh
        run: |
          $folder = "dist/AI-Meeting-Assistant"
          if (!(Test-Path "$folder/AI-Meeting-Assistant.exe")) { throw 'Missing executable' }
          foreach ($dir in @('data','models','logs')) {
            New-Item -ItemType Directory -Force "$folder/$dir" | Out-Null
          }
          Copy-Item packaging/PORTABLE-README.txt "$folder/README.txt"
          Copy-Item .env.example "$folder/data/.env.example"
      - name: Remove smoke-test runtime logs
        shell: pwsh
        run: |
          $log = 'dist/AI-Meeting-Assistant/logs/application.log'
          if (Test-Path $log) { Remove-Item $log }
      - name: Microsoft Defender malware scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $status = Get-MpComputerStatus
          $status | Select-Object AMServiceEnabled, AntivirusEnabled, RealTimeProtectionEnabled, AntivirusSignatureVersion, AntivirusSignatureLastUpdated | ConvertTo-Json | Set-Content security-reports/defender-status.json
          if (!$status.AMServiceEnabled -or !$status.AntivirusEnabled) { throw 'Defender unavailable; binary scan cannot be verified' }
          Update-MpSignature
          $scan = Join-Path $env:ProgramFiles 'Windows Defender/MpCmdRun.exe'
          $platform = Get-ChildItem "$env:ProgramData/Microsoft/Windows Defender/Platform" -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending | Select-Object -First 1
          if ($platform -and (Test-Path (Join-Path $platform.FullName 'MpCmdRun.exe'))) { $scan = Join-Path $platform.FullName 'MpCmdRun.exe' }
          $target = (Resolve-Path 'dist/AI-Meeting-Assistant').Path
          & $scan -Scan -ScanType 3 -File $target -DisableRemediation 2>&1 | Tee-Object -FilePath security-reports/defender-scan.txt
          $exitCode = $LASTEXITCODE
          "Defender exit code: $exitCode" | Add-Content security-reports/defender-scan.txt
          if ($exitCode -ne 0) { throw 'Defender scan failed or detected a threat' }
      - name: Generate SHA256 manifest
        shell: pwsh
        run: |
          @'
          import hashlib
          from pathlib import Path

          root = Path("dist/AI-Meeting-Assistant").resolve(strict=True)
          manifest = root / "SHA256SUMS.txt"
          manifest.unlink(missing_ok=True)
          files = sorted(p for p in root.rglob("*") if p.is_file())
          if not files or not (root / "AI-Meeting-Assistant.exe").is_file():
              raise RuntimeError("Portable build missing or empty")
          lines = []
          for path in files:
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              lines.append(f"{digest}  {path.relative_to(root).as_posix()}")
          content = "\n".join(lines) + "\n"
          manifest.write_text(content, encoding="utf-8")
          Path("security-reports/SHA256SUMS.txt").write_text(content, encoding="utf-8")
          print(f"SHA256 manifest generated for {len(files)} files")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'SHA256 manifest generation failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports-${{ github.run_id }}
          path: security-reports/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Meeting-Assistant-v${{ env.APP_VERSION }}-Portable-x64
          path: dist/AI-Meeting-Assistant/
          include-hidden-files: true
          compression-level: 9
          if-no-files-found: error
