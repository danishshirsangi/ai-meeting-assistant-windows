name: Build Windows Portable
on:
  push:
    branches: [Dev-Setup]
    paths:
      - '.github/workflows/windows-build.yml'
      - 'packaging/**'
      - 'main.py'
      - 'core/**'
      - 'audio/**'
      - 'ui/**'
      - 'assets/**'
      - 'requirements*.txt'
  workflow_dispatch:
    inputs:
      version:
        description: Portable version (major.minor.patch)
        default: '1.0.0'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      APP_VERSION: ${{ inputs.version || '1.0.0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Validate version
        shell: pwsh
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Version must be major.minor.patch' }
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-audio-windows.txt
          python -m pip install pytest pyinstaller
          python -m pip check
      - name: Test
        run: python -m pytest -q
      - name: Package application
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name AI-Meeting-Assistant --add-data "assets;assets" --collect-all faster_whisper --collect-all ctranslate2 --collect-all av --collect-all soundcard --collect-all sounddevice --collect-all soundfile --collect-all _sounddevice_data --collect-all _soundfile_data --collect-all pynput --collect-all google.genai --collect-all pygments main.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
      - name: Prepare portable folder
        shell: pwsh
        run: |
          $folder = "dist/AI-Meeting-Assistant"
          if (!(Test-Path "$folder/AI-Meeting-Assistant.exe")) { throw 'Missing executable' }
          foreach ($dir in @('data','models','logs')) {
            New-Item -ItemType Directory -Force "$folder/$dir" | Out-Null
          }
          Copy-Item packaging/PORTABLE-README.txt "$folder/README.txt"
          Copy-Item .env.example "$folder/data/.env.example"
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Meeting-Assistant-v${{ env.APP_VERSION }}-Portable-x64
          path: dist/AI-Meeting-Assistant/
          include-hidden-files: true
          if-no-files-found: error
